name: Test and deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Serialize deployments. When pushes land close together, the newer queued run
# supersedes the older queued one (which is skipped, not failed), while the
# in-progress deployment is allowed to finish. This stops the "Deployment
# failed, try again later" collisions that the legacy Pages builder produced.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 629 assertions and four data audits existed before this job did, and none
  # of them had ever run anywhere but a laptop. Every push went straight to
  # Pages: a commit that broke the builder was live before anyone could know,
  # and CLAUDE.md §6 says to push unverified work rather than hide it in a
  # branch — which only works if something downstream is checking.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          prune-cache: true

      # Everything: the six JS suites, plus ruff and pyright over tools/dzc,
      # which test-all.mjs runs itself when uv is on the machine.
      - name: The suite
        run: node scripts/test-all.mjs

      # The stat-card PDFs are not in the repo, so the scan cannot run here.
      # The audits read data/ and assets/ and catch a bad commit of either.
      - name: Data audits
        run: uv run python tools/dzc/rebuild.py --skip-scan

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Stage ONLY the site. The repo carries ~317 MB of rules and lore PDFs the
      # app never fetches, plus the scanner, the one-off scripts and the
      # reference pages. Uploading those made every deploy slow for nothing.
      # Anything the running site fetches MUST be listed here.
      - name: Stage site
        run: |
          mkdir -p _site
          cp -r index.html favicon.ico manifest.webmanifest sw.js \
                css js data assets \
                _site/
          echo "--- staged: $(du -sh _site | cut -f1) ---"
          du -sh _site/* | sort -h

      # Pages serves css/ and js/ with a ~10 minute cache and no fingerprint,
      # so a deploy does not reach anyone still holding the old copy. A fix has
      # already appeared not to deploy at all for exactly this reason
      # (HANDOFF section 8). Stamp every local css/js reference with the commit
      # SHA so a new build is a new URL.
      #
      # Data JSON is deliberately NOT stamped: its filenames have to stay
      # stable for the monthly re-scan, and it is fetched with
      # cache: 'no-cache' so it revalidates on its own.
      - name: Cache-bust css and js with the commit SHA
        run: |
          SHA="${GITHUB_SHA::8}"
          find _site -name '*.html' -print0 | xargs -0 sed -i -E \
            's#(href="|src=")((css|js)/[^"?]+\.(css|js))"#\1\2?v='"$SHA"'"#g'
          echo "--- stamped with $SHA ---"
          grep -ohE '(href|src)="(css|js)/[^"]+"' _site/index.html | head -20

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
