name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Serialize deployments. When pushes land close together, the newer queued run
# supersedes the older queued one (which is skipped, not failed), while the
# in-progress deployment is allowed to finish. This stops the "Deployment
# failed, try again later" collisions that the legacy Pages builder produced.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Stage ONLY the site. The repo carries ~317 MB of rules and lore PDFs the
      # app never fetches, plus the scanner, the one-off scripts and the
      # reference pages. Uploading those made every deploy slow for nothing.
      # Anything the running site fetches MUST be listed here.
      - name: Stage site
        run: |
          mkdir -p _site
          cp -r index.html favicon.ico manifest.webmanifest sw.js \
                css js data assets \
                _site/
          # Drop what only the retired Dropfleet views used. Nothing in the
          # Dropzone app reads any of it, and assets/art alone is 58 MB of
          # SPACESHIP art for a game about ground forces.
          rm -rf _site/assets/art _site/assets/factions
          rm -f  _site/data/faction-*.json _site/data/fleet-index.json \
                 _site/data/fleet-data.json _site/data/ship-lore.json \
                 _site/data/pronunciations.json
          echo "--- staged: $(du -sh _site | cut -f1) ---"
          du -sh _site/* | sort -h

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
