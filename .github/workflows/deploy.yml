name: Test and deploy to GitHub Pages

# A push made with the default GITHUB_TOKEN does not start a workflow — that
# is GitHub's rule against a job triggering itself forever. "Watch TTCombat for
# new PDFs" commits with that token, so its data landed on master and stopped
# there: deployed nowhere, waiting on the next push by a person. workflow_run
# is the way back in, and it does not need a personal token.
on:
  push:
    branches: [master]
  workflow_run:
    workflows: ["Watch TTCombat for new PDFs"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  # write, not read: the deploy job deletes an earlier attempt's upload.
  actions: write
  pages: write
  id-token: write

# Serialize deployments. When pushes land close together, the newer queued run
# supersedes the older queued one (which is skipped, not failed), while the
# in-progress deployment is allowed to finish. This stops the "Deployment
# failed, try again later" collisions that the legacy Pages builder produced.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 629 assertions and four data audits existed before this job did, and none
  # of them had ever run anywhere but a laptop. Every push went straight to
  # Pages: a commit that broke the builder was live before anyone could know,
  # and CLAUDE.md §6 says to push unverified work rather than hide it in a
  # branch — which only works if something downstream is checking.
  test:
    runs-on: ubuntu-latest
    # workflow_run fires whatever the outcome. A re-scan that failed its audits
    # is the one run that must not reach Pages.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      # ref: master, not the default. On a workflow_run event GITHUB_SHA is the
      # commit that STARTED the other workflow — the state before it committed
      # anything — so the default checkout would test and deploy the data this
      # is meant to replace.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: master

      - name: Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          prune-cache: true

      # Everything: the six JS suites, plus ruff and pyright over tools/dzc,
      # which test-all.mjs runs itself when uv is on the machine.
      - name: The suite
        run: node scripts/test-all.mjs

      # Three audits (card text, Special cells, construction) compare the data with
      # the PDFs it was scanned from. Those are not in the repo, so fetch exactly
      # the releases data/dzc/sources.json records, not the page's newest: a
      # release the monthly update has not taken in yet would fail them against
      # data that is not wrong. The cache keeps them between deploys, keyed on the
      # record, so most deploys download nothing.
      - name: The source PDFs
        uses: actions/cache@v4
        with:
          path: rules
          key: dzc-sources-${{ hashFiles('data/dzc/sources.json') }}

      - name: Fetch any that are missing
        run: uv run python tools/dzc/fetch_sources.py --recorded

      # The audits read data/, assets/ and those PDFs, and catch a bad commit.
      - name: Data audits
        run: uv run python tools/dzc/rebuild.py --skip-scan

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: master

      # Stage ONLY the site. The repo carries ~317 MB of rules and lore PDFs the
      # app never fetches, plus the scanner, the one-off scripts and the
      # reference pages. Uploading those made every deploy slow for nothing.
      # Anything the running site fetches MUST be listed here.
      - name: Stage site
        run: |
          mkdir -p _site
          cp -r index.html favicon.ico manifest.webmanifest sw.js \
                css js data assets scenarios interactive-rules \
                _site/
          echo "--- staged: $(du -sh _site | cut -f1) ---"
          du -sh _site/* | sort -h

      # Pages serves css/ and js/ with a ~10 minute cache and no fingerprint,
      # so a deploy does not reach anyone still holding the old copy. A fix has
      # already appeared not to deploy at all for exactly this reason
      # (HANDOFF section 8). Stamp every local css/js reference with the commit
      # SHA so a new build is a new URL.
      #
      # Data JSON is deliberately NOT stamped: its filenames have to stay
      # stable for the monthly re-scan, and it is fetched with
      # cache: 'no-cache' so it revalidates on its own.
      - name: Cache-bust css and js with the commit SHA
        run: |
          # HEAD, not GITHUB_SHA: on a workflow_run event those are different
          # commits, and GITHUB_SHA is the stale one. A stamp that does not
          # move is a cache bust that does not bust.
          SHA="$(git rev-parse --short=8 HEAD)"
          find _site -name '*.html' -print0 | xargs -0 sed -i -E \
            's#(href="|src=")((css|js)/[^"?]+\.(css|js))"#\1\2?v='"$SHA"'"#g'
          echo "--- stamped with $SHA ---"
          grep -ohE '(href|src)="(css|js)/[^"]+"' _site/index.html | head -20

      - name: Configure Pages
        uses: actions/configure-pages@v6
      # A re-run keeps the run's earlier artifacts, so attempt 2 uploads a
      # second github-pages and deploy-pages refuses: "Multiple artifacts
      # named github-pages were unexpectedly found" (Build 525's re-run,
      # 2026-11-15). Clear an earlier attempt's upload first, so a re-run, by
      # hand or by retry.yml, can actually deploy.
      - name: Clear an earlier attempt's upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in $(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages" \
                        --jq '.artifacts[].id'); do
            echo "deleting earlier github-pages artifact $id"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
          done

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "_site"

      # Build 525 (2026-11-15) never reached Pages. The upload finalized at
      # 05:16:59.87, deploy-pages asked for it 0.4s later, GitHub's artifact
      # list had not caught up ("Found 0 artifact(s)"), and the job failed
      # with the site still on 524. Ask the same API deploy-pages asks, and do
      # not go on until it answers.
      - name: Wait until GitHub lists the upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 24); do
            n=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages" \
                  --jq '.total_count' 2>/dev/null || echo 0)
            if [ "${n:-0}" -gt 0 ]; then echo "listed after $i check(s)"; exit 0; fi
            sleep 5
          done
          echo "::warning::github-pages artifact still not listed after 2 minutes; trying the deploy anyway"

      # And if it still says no, once more after a pause, in this job, rather
      # than leaving the site behind until someone notices.
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - name: Pause before the second attempt
        if: steps.deployment.outcome == 'failure'
        run: sleep 60
      - name: Deploy to GitHub Pages (second attempt)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
