name: Watch TTCombat for new PDFs

# Every second Monday at 09:00 UTC, and on demand.
#
# Cron has no "fortnightly", so this runs weekly and the job itself skips the
# odd weeks. A schedule that lies about its interval is worse than one that
# runs twice as often and says so.
on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      force:
        description: "Run even on an off week"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: "sources"
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Is this the fortnight?
        id: week
        run: |
          WEEK=$(date -u +%V)
          if [ "${{ inputs.force }}" = "true" ] || [ $((10#$WEEK % 2)) -eq 0 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "ISO week $WEEK is an odd week — skipping."
          fi

      - name: Node
        if: steps.week.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install uv
        if: steps.week.outputs.run == 'true'
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          prune-cache: true

      # Reports what the resources page is serving against what rules/ holds,
      # and exits 1 when anything has moved. continue-on-error because "there
      # is a new release" is the interesting outcome, not a failure.
      - name: What is TTCombat publishing?
        if: steps.week.outputs.run == 'true'
        id: check
        continue-on-error: true
        run: |
          uv run python tools/dzc/fetch_sources.py --check | tee check.log
          echo "changed=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Download and re-scan
        if: steps.week.outputs.run == 'true' && steps.check.outputs.changed != '0'
        run: |
          uv run python tools/dzc/fetch_sources.py
          # The whole pipeline: scan both PDF sets, then all seven audits. The
          # audits are the gate, and audit_construction is the one that can
          # stop THIS job doing harm: every other audit checks the scan against
          # itself, so a point release that moved a force-construction rule
          # would pass them all while the builder went on enforcing the last
          # edition's. It reads chapter 3 out of the rulebook and fails the
          # run, which is what should happen -- a moved construction rule needs
          # a person, not a re-scan.
          #
          # audits are the gate. They are what caught the 260805 release
          # renaming a Type cell from "Aircraft" to "Aircraft (40mm)", which
          # silently dropped every Aircraft card in the game — UCM came back
          # with 20 units instead of 36 and no dropships at all.
          #
          # scan_variant_art is NOT run here and cannot be: it reads the
          # previous edition's cards out of Pics/, which is gitignored and
          # exists on one machine. That used to mean an unattended re-scan
          # deleted all 155 variant photographs; scan_statcards carries them
          # across a rewrite itself now, so the photos survive a run that
          # cannot regenerate them.
          uv run python tools/dzc/rebuild.py

      # A new PDF does not always mean new data — TTCombat reissue files that
      # scan to the same numbers. This asks about the scan's output, not its
      # input: rules/ is always dirty here, because fetch_sources.py has just
      # written the new PDFs into it. Those get committed either way; only a
      # change in data/ is a reason to raise the build number.
      #
      # --porcelain rather than `git diff --quiet` because a genuinely new
      # unit arrives as an untracked file in assets/units, which a diff of
      # tracked files does not see.
      - name: Did the data actually change?
        if: steps.week.outputs.run == 'true' && steps.check.outputs.changed != '0'
        id: data
        run: |
          if [ -z "$(git status --porcelain -- data assets/units)" ]; then
            echo "New PDFs, but the scan produced identical data."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Before the tests, so test-shell.mjs is what proves the two numbers
      # still match. Data that lands without a new cache name is data nobody
      # sees: sw.js precaches data/dzc/index.json and rules.json, so an
      # installed app keeps serving the old points with nothing to say so.
      - name: Raise the build number
        if: steps.week.outputs.run == 'true' && steps.data.outputs.changed == 'true'
        run: node scripts/bump-build.mjs

      - name: Prove it
        if: steps.week.outputs.run == 'true' && steps.check.outputs.changed != '0'
        run: node scripts/test-all.mjs

      # Only reached when the scan AND every audit AND the whole suite passed,
      # because each step above fails the job. An unattended commit is fine on
      # that basis and not on any weaker one — this is the file every number in
      # the app comes out of.
      - name: Commit the new data
        if: steps.week.outputs.run == 'true' && steps.check.outputs.changed != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A rules data assets/units js/dzc-shell.js sw.js
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -F - <<'MSG'
          Re-scan against TTCombat's current PDFs

          Automatic. tools/dzc/fetch_sources.py found the resources page serving
          something newer than rules/ held, downloaded it, and re-ran the whole
          pipeline. Committed only because every audit and all of
          scripts/test-all.mjs passed against the result.

          The superseded PDFs are dropped rather than kept beside the new
          ones -- rules/ is already hundreds of MB of committed PDF, and git
          history is the record of what the previous data was built from:
          `git show HEAD~1:rules/<old>.pdf` recovers one.

          No changelog entry. Nobody read this diff — what changed in the
          points is still to be written up by hand.
          MSG
          git push

      - name: Say what happened
        if: steps.week.outputs.run == 'true'
        run: |
          if [ "${{ steps.check.outputs.changed }}" = "0" ]; then
            echo "### rules/ matches the resources page" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### TTCombat published something new" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat check.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
