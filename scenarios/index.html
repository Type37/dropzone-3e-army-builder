<style>
@font-face{font-family:'Terminal Grotesque Open';src:url('../assets/fonts/terminal-grotesque-open.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap;}
/* The credits footer rides the bottom of the screen until the WarLore footer
   arrives, as on Dropfleet. On a phone with the tracker bar up it rides just above it. */
.foot{position:sticky;bottom:0;z-index:20;}
/* shared/shell.css asks for 360px columns, wider than a 320px phone. Never wider than the list. */
.scn-list{grid-template-columns:repeat(auto-fill,minmax(min(360px,100%),1fr));}
@media (max-width:700px){body.has-trk .foot{bottom:var(--trk-h,64px);}}

/* The book's key beside a line: its colour square, disc, outline, line or token */
.dz-ico{display:inline-block;width:22px;height:22px;flex:0 0 22px;vertical-align:-5px;margin-right:8px;box-sizing:border-box;}
.dz-ico.sq{border:1px solid rgba(14,12,8,.35);}
.dz-ico.disc{border-radius:50%;border:1px solid rgba(14,12,8,.35);}
.dz-ico.outline{border:2.5px solid;}
.dz-ico.line{height:5px;vertical-align:4px;}
img.dz-ico{object-fit:contain;}
.dz-key{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2mm;}
.dz-key li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;align-items:start;}
.dz-key li .dz-ico{margin:1px 0 0;}
.dz-key li .dz-ico.line{margin-top:10px;}
/* An objective's lines, rule and terms, and a Variant's, spaced as the section body spaces its own */
.dz-group,.pub-vlist li>div{display:flex;flex-direction:column;gap:2.4mm;min-width:0;}
/* Four game sizes: two by two, so each keeps its points on one line */
.pub-opts .seg.pub-size{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));}
.pub-opts .seg.pub-size .pub-size-pts{white-space:nowrap;}
/* Map spots: Zones are square, tokens and points round */
.map-frame .hs.hs-zone{border-radius:0;}
.map-svg svg{height:auto;}
#scn-tip .dz-ico{width:16px;height:16px;flex:0 0 16px;margin:0;}

/* Turret weapons */
.dz-tbl-wrap{overflow-x:auto;container-type:inline-size;}
.dz-tbl{border-collapse:collapse;font-family:'Jost',system-ui,sans-serif;font-size:var(--fs-body);width:100%;color:var(--ch);}
.dz-tbl th{font-size:var(--fs-small);font-weight:400;color:#5d5850;text-align:left;padding:2px 10px 2px 0;white-space:nowrap;}
.dz-tbl td{padding:4px 10px 4px 0;vertical-align:top;}
.dz-tbl tbody tr:nth-child(odd){background:rgba(184,149,47,.09);}
.dz-tbl td:first-child{font-weight:600;white-space:nowrap;}
/* Too narrow for seven columns: each weapon becomes its name over a 3 x 2 grid of labelled stats */
@media screen{@container (max-width:459px){
  .dz-tbl,.dz-tbl tbody,.dz-tbl tr,.dz-tbl td{display:block;}
  .dz-tbl thead{display:none;}
  .dz-tbl tbody tr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px 10px;padding:6px 6px 8px;}
  .dz-tbl td{padding:0;overflow-wrap:anywhere;}
  .dz-tbl td:first-child{grid-column:1/-1;white-space:normal;padding-bottom:2px;}
  .dz-tbl td[data-l]::before{content:attr(data-l);display:block;font-size:var(--fs-small);font-weight:400;color:#5d5850;}
}}
@media print{.dz-tbl-wrap{overflow:visible;}.dz-tbl{font-size:7.5pt;}.dz-tbl th{font-size:7pt;}.dz-ico{width:11px;height:11px;flex-basis:11px;margin-right:4px;vertical-align:-2px;}.dz-key li{grid-template-columns:11px minmax(0,1fr);gap:4px;}}

/* Game size (rulebook 3.1): the map's layers and anything only used in bigger games follow the switch */
.scenario.pub:not([data-size="skirmish"]) [data-only="skirmish"]{display:none;}
/* 9.5: in a Skirmish an objective's points and KP stay printed, struck, with half beside them */
.hv-half{display:none;}
.scenario.pub[data-size="skirmish"] .hv-full,.hv-on .hv-full{text-decoration:line-through;}
.scenario.pub[data-size="skirmish"] .hv-half,.hv-on .hv-half{display:inline;font-weight:600;margin-left:.25em;}
/* Two Variants a scenario (the card's stylesheet covers one) */
.scenario.pub:not([data-v="2"]) .hs[data-v="2"]{display:none;}
.scenario.pub[data-v="2"] svg [data-v="2"]{display:inline;}
.scenario.pub[data-v="2"] [data-hide-v~="2"]{display:none;}
/* An objective a Variant removes stays on the card, struck through */
.scenario.pub[data-v="1"] [data-strike-v~="1"] :is(.rule-text,.spill),.scenario.pub[data-v="2"] [data-strike-v~="2"] :is(.rule-text,.spill){text-decoration:line-through;color:#5d5850;}
</style>

    <a href="https://github.com/Type37/dropzone-3e-army-builder" target="_blank" rel="noopener">Source on GitHub</a>
  </div>

<script src="dzc-scenario-terms.js"></script>
<script src="dzc-scenario-hotspots.js"></script>
<script src="dzc-scenario-sheets.js"></script>
<script src="shared/tooltip.js"></script>

<script>
const SOURCES={rulebook:{group:'Rulebook',book:'Rulebook'},fauna:{group:'Fauna Rules & Scenarios',book:'Fauna Rules & Scenarios'}};
// Both books are on TTCombat's Dropzone resources page
const SOURCE_URL='https://ttcombat.com/pages/dropzone-commander-resources';
// The objectives the rulebook names (9.6), in the order a scenario lists them
const OBJECTIVES=['Attrition','Secure','Occupy','Extract','Protect','Dominate','Displace','Raze','Explore'];
const T=DZ_TERMS;

/* The legend comes out of the PDF a printed line at a time. Join each entry's
   lines back into its sentence, and drop the page numbers that ride along. */
function sentence(lines){
  return lines.filter(l=>!/^\d{1,2}$/.test(l.trim())).reduce((out,l)=>!out?l:out.endsWith('/')?out+l:out+' '+l,'').trim();
}
/* A map key entry stacks separate facts ("2 Hardened Large Zones", "Only use in..."); keep each on its own
   line, joining only where a sentence wraps onto a line that starts in lower case. */
function keyLines(lines){
  return lines.filter(l=>!/^\d{1,2}$/.test(l.trim())).reduce((out,l)=>{
    if(!out) return l;
    if(out.endsWith('/')) return out+l;
    const prev=out.split('<br>').pop();
    const fact=prev.split(' ').every(w=>/^[A-Z0-9(]/.test(w));
    const newFact=prev.endsWith('.')||fact||/^(Only use|Each )/.test(l);
    return out+(newFact&&!/^[a-z]/.test(l)?'<br>':' ')+l;
  },'').trim();
}
// "Only use in Clash, Battle & Reconquest": the smallest game size an entry is on the table in
const sizeOf=t=>{const m=t.match(/Only use in ([^.]*)/);return m?(/Clash/.test(m[1])?'clash':'battle'):'';};
function parse(s){
  const key=[], objectives=[], variants=[], rules=[];
  let entry='';
  for(const L of s.legend){
    const text=sentence(L.lines);
    if(!text) continue;
    if(/^Entry:/.test(text)) entry=text.replace(/^Entry:\s*/,'');
    else if(/^Variant \d/.test(text)) variants.push(text);
    // Variants close every legend; a line after one is that variant running on ("Remove Attrition and add" / "Dominate these...")
    else if(variants.length&&!L.rgb&&!L.keys) variants[variants.length-1]+=' '+text;
    else if(OBJECTIVES.some(o=>text.startsWith(o))) objectives.push({L,text,size:sizeOf(text),name:OBJECTIVES.find(o=>text.startsWith(o))});
    else key.push({L,size:sizeOf(text)});
  }
  // The Fauna pack sets Entry, its special rules and its Variants under the map; Ground Control's Zone Placement too
  for(const note of s.notes||[]){
    if(/^Entry:/.test(note)) entry=entry||note.replace(/^Entry:\s*/,'');
    else if(/^Variant( \d)?:/.test(note)) variants.push(note);
    else rules.push(note);
  }
  const vs=variants.map((v,i)=>{ const m=v.match(/^(Variant(?: (\d))?):\s*/); return {n:m&&m[2]?m[2]:String(i+1),label:m?m[1]:`Variant ${i+1}`,text:m?v.slice(m[0].length):v}; });
  return {key,objectives,entry,variants:vs,rules};
}
const objectiveNames=s=>parse(s).objectives.map(o=>o.name).filter((o,i,a)=>a.indexOf(o)===i);

/* ── The book's keys: a legend entry's lines, split where the book prints a new key beside a line ── */
const rgbCss=a=>`rgb(${a.map(v=>Math.round(v*255)).join(',')})`;
function keyIcon(k){
  if(!k) return '';
  if(k.token) return `<img class="dz-ico" src="../assets/tokens/${k.token}.${k.token==='hive'?'svg':'webp'}" alt="">`;
  if(k.square) return `<span class="dz-ico sq" style="background:${rgbCss(k.square)}"></span>`;
  if(k.circle) return `<span class="dz-ico disc" style="background:${rgbCss(k.circle)}"></span>`;
  if(k.outline) return `<span class="dz-ico outline" style="border-color:${rgbCss(k.outline)}"></span>`;
  if(k.line) return `<span class="dz-ico line" style="background:${rgbCss(k.line)}"></span>`;
  return '';
}
function segments(L){
  const keys=L.keys||[L.rgb?{at:0,square:L.rgb}:{at:0}];
  return keys.map((k,i)=>({icon:keyIcon(k),lines:L.lines.slice(k.at,i+1<keys.length?keys[i+1].at:undefined)}));
}

/* ── Explanations: every rule a scenario names, word for word from the rulebook (dzc-scenario-terms.js),
   written under the named term as a bold run-in, as the Dropfleet pages do ── */
const wordRe=(n,plural)=>new RegExp('\\b'+n.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+(plural?'s?':'')+'\\b',plural?'i':'');
const words=n=>wordRe(n,true);
const firstAt=(text,list)=>list.map(([name,re,run])=>({name,run,m:text.match(re)})).filter(x=>x.m).sort((a,b)=>a.m.index-b.m.index);
const para=html=>`<p class="rule-text">${html}</p>`;
const runIn=(name,html)=>para(`<b class="run-in">${name}.</b> ${html}`);
const tipName=(kind,n)=>`<span class="tip-t" tabindex="0" data-tip="${kind}:${n}">${n}</span>`;
const ruleTip=name=>T.specialRules[name]?tipName('dzr',name):name;
// Turret specials ("Demo 1", "AA-S", "Destroyer 5+, Demo 5") open their weapon rule on hover
const specials=txt=>txt.split(/,\s*/).map(part=>{const m=part.match(/^([A-Za-z-]+(?: [A-Z][a-z]+)?)(.*)$/);return m&&T.specialRules[m[1]]?ruleTip(m[1])+m[2]:part;}).join(', ');
function weaponTable(names){
  return `<div class="dz-tbl-wrap"><table class="dz-tbl"><thead><tr><th>Weapon</th><th>Arc</th><th>Range</th><th>Attacks</th><th>Accuracy</th><th>Energy</th><th>Special</th></tr></thead><tbody>${names.map(n=>{const w=T.weaponFeatures.weapons[n];return `<tr><td>${tipName('dzf',n)}</td><td data-l="Arc">${w.arc}</td><td data-l="Range">${w.range}</td><td data-l="Attacks">${w.attacks}</td><td data-l="Accuracy">${w.accuracy}</td><td data-l="Energy">${w.energy}</td><td data-l="Special">${w.special==='-'?'-':specials(w.special)}</td></tr>`;}).join('')}</tbody></table></div>`;
}
/* 9.5: a Skirmish halves the points and KP an objective asks for. The rule's number stays, struck, with half beside it */
function halvable(text){ return text.replace(/\b(\d+)(\s?)(pts|KP)\b/g,(m,n,sp,u)=>`<span class="hv"><span class="hv-full">${n}</span><span class="hv-half">${n/2}</span></span>${sp}${u}`); }
const HALVED=Object.entries(T.objectives).filter(([,o])=>/\d\s?(pts|KP)\b/.test(o.body.join(' '))).map(([n])=>n);
/* The terms a piece of text names, in the order it names them; each is explained only once per card */
function explain(text,shown){
  const out=[], weapons=[];
  const once=(key,fn)=>{ if(shown.has(key)) return; shown.add(key); fn(); };
  const list=[
    ...Object.entries(T.objectives).map(([n,o])=>[n,wordRe(n),()=>once('o:'+n,()=>out.push(runIn(o.heading,halvable(o.body.join(' ')))))]),
    ['Territory',/\bTerritor/,()=>once('territory',()=>out.push(runIn('Territory',T.territory.join(' '))))],
    ...Object.entries(T.entry).map(([n,b])=>[n,n==='Deployed'?/\bDeploy/:wordRe(n),()=>once('e:'+n,()=>out.push(runIn(n,b.join(' '))))]),
    ...Object.entries(T.extraction).map(([n,b])=>[n,wordRe(n),()=>once('x:'+n,()=>out.push(runIn(n,b)))]),
    ['Object',/\bObjects?\b/,()=>once('objects',()=>['Objects','Finding Objects','Carrying Objects'].forEach(n=>out.push(runIn(n,T.objects[n].join(' ')))))],
    ...Object.entries(T.variantObjects).map(([n,b])=>[n,wordRe(n),()=>once('v:'+n,()=>out.push(runIn(n,b.join(' '))))]),
    ['Bunker Entrance',/\bBunker Entrances?\b/,()=>once('bunker',()=>out.push(runIn('Bunker Entrances',T.bunkerEntrances.join(' '))))],
    ...Object.keys(T.weaponFeatures.weapons).map(n=>[n,words(n),()=>once('w:'+n,()=>weapons.push(n))]),
    ...Object.entries(T.features).map(([n,f])=>[n,words(n),()=>once('f:'+n,()=>out.push(runIn(tipName('dzf',n),f.text)))]),
    // unit rules the map keys name
    ...['Demo Charges','Living Weapons','Bloodthirsty'].map(n=>[n,words(n.replace(/s$/,'')),()=>once('r:'+n,()=>out.push(runIn(T.specialRules[n].heading,T.specialRules[n].body.join(' '))))]),
  ];
  firstAt(text,list).forEach(x=>x.run());
  let html=out.join('');
  if(weapons.length) html+=weaponTable(weapons)+(shown.has('weaponRules')?'':(shown.add('weaponRules'),para(T.weaponFeatures.rules.join(' '))));
  return html;
}

/* ── The map: redrawn as SVG (tools/dzc/draw_scenario_maps.py) ── */
const redrawn=s=>typeof DZ_MAP_SPOTS!=='undefined'&&DZ_MAP_SPOTS[s.id];
const mapSrc=s=>redrawn(s)?`../assets/scenarios/${s.id}.svg`:'../'+s.map;
// The tokens on a map and the rule each one is
const TOKEN_RULE={'heavy-cannon':'Heavy Cannon Turret','railgun-turret':'Railgun Turret','flak-turret':'Flak Turret','missile-turret':'Missile Turret','laser-turret':'Laser Turret','super-laser':'Superlaser Turret','excellent-vantage':'Excellent Vantage','acm-package':'ACM Package','shield-generator':'Shield Generator','comms-uplink-tower':'Comms Uplink','power-core':'Power Core','internal-flaw':'Internal Flaw','seal':'Seal','automated-sentries':'Automated Sentries','jamming-device':'Jamming Device','shimmer-field':'Shimmer Field','basement':'Basement','secret-entrance':'Secret Entrance'};
let CURRENT=null;
function spotsHTML(s){
  return (redrawn(s)||[]).map(p=>{
    const zone=p.t==='zone';
    const box=zone?`left:${p.x-p.w/2}%;top:${p.y-p.h/2}%;width:${p.w}%;height:${p.h}%`:`left:${p.x-p.r}%;top:${p.y-p.r}%;width:${2*p.r}%;height:${2*p.r}%`;
    const key=(zone||(p.t==='point'&&p.legend!==undefined))?`dzz:${p.legend}`:TOKEN_RULE[p.token]?`dzf:${TOKEN_RULE[p.token]}`:p.token==='object'?'dzo:Objects':p.token==='secure-point'?'dzo:Secure':p.token==='bunker-entrance'?'dzo:Bunker Entrances':'';
    const layer=`${p.size?` data-size="${p.size}"`:''}${p.v?` data-v="${p.v}"`:''}${p.hideV?` data-hide-v="${p.hideV}"`:''}`;
    return key?`<span class="hs${zone?' hs-zone':''}" tabindex="0" data-tip="${key}"${layer} style="${box}"></span>`:'';
  }).join('');
}
const SVG_TEXT={};
// A redrawn map is inlined once fetched, so its size and Variant layers can follow the buttons
async function inlineMaps(){
  for(const el of document.querySelectorAll('.map-svg[data-src]')){
    const src=el.dataset.src, alt=el.querySelector('img').alt;
    el.removeAttribute('data-src');
    try{ SVG_TEXT[src]=SVG_TEXT[src]||await fetch(src).then(r=>{ if(!r.ok) throw new Error(r.status); return r.text(); }); }
    catch(e){ continue; }
    el.innerHTML=SVG_TEXT[src].replace('<svg ',`<svg role="img" aria-label="${alt}" `);
  }
}

function tipHTML(key){
  const i=key.indexOf(':'), kind=key.slice(0,i), id=key.slice(i+1);
  if(kind==='dzz'&&CURRENT){ const L=CURRENT.legend[+id]; if(!L) return ''; const seg=segments(L)[0]; return `<div class="scn-tip-h">${seg.icon}<b>${keyLines(L.lines)}</b></div>`; }
  if(kind==='dzo'){
    if(id==='Objects') return `<div class="scn-tip-h"><b>Objects</b></div><div>${T.objects.Objects.join(' ')}</div>`;
    if(id==='Bunker Entrances') return `<div class="scn-tip-h"><b>Bunker Entrances</b></div><div>${T.bunkerEntrances.join(' ')}</div>`;
    const o=T.objectives[id]; return o?`<div class="scn-tip-h"><b>${o.heading}</b></div><div${sizeNow()==='skirmish'?' class="hv-on"':''}>${halvable(o.body.join(' '))}</div>`:'';
  }
  if(kind==='dzr'){ const r=T.specialRules[id]; return r?`<div class="scn-tip-h"><b>${r.heading}</b></div><div>${r.body.join(' ')}</div>`:''; }
  if(kind==='dzf'){
    const w=T.weaponFeatures.weapons[id];
    if(w) return `<div class="scn-tip-h"><b>${id}</b></div><div>Arc ${w.arc}, Range ${w.range}, Attacks ${w.attacks}, Accuracy ${w.accuracy}, Energy ${w.energy}${w.special!=='-'?`, ${w.special}`:''}</div>`;
    const f=T.features[id]; return f?`<div class="scn-tip-h"><b>${id}</b></div><div>${f.text}</div>`:'';
  }
  return '';
}

/* ── Game size and Variants: one size for every scenario, one Variant at a time per scenario ── */
const SIZES=['Skirmish','Clash','Battle','Reconquest'];
// Points for each game size, rulebook 3.1 (data/dzc/index.json gameSizes)
const SIZE_PTS={Skirmish:'501-1000',Clash:'1001-2000',Battle:'2001-3000',Reconquest:'3001+'};
const TICK='<svg class="pub-size-tick" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5L20 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const store={get(k){try{return localStorage.getItem(k);}catch(e){return null;}},set(k,v){try{localStorage.setItem(k,v);}catch(e){}}};
const SIZE_KEY='dzc-scenario-size', variantKey=id=>`dzc-scenario-variant:${id}`;
const sizeNow=()=>{ const z=store.get(SIZE_KEY); return SIZES.some(x=>x.toLowerCase()===z)?z:'battle'; };
// A scenario shows the size switch when its Zones change with size or an objective asks for points or KP
const sized=s=>{ const p=parse(s); return p.key.some(k=>k.size)||p.objectives.some(o=>o.size)||p.objectives.some(o=>HALVED.includes(o.name)); };
const sizeFor=s=>sized(s)?sizeNow():'battle';
const variantFor=s=>{ const v=store.get(variantKey(s.id)); return parse(s).variants.some(x=>x.n===v)?v:'0'; };
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-set-size],[data-set-v]'), card=b&&b.closest('.scenario.pub');
  if(!card) return;
  if(b.dataset.setSize){
    card.dataset.size=b.dataset.setSize;
    store.set(SIZE_KEY,b.dataset.setSize);
    card.querySelectorAll('[data-set-size]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
  }else{
    const v=card.dataset.v===b.dataset.setV?'0':b.dataset.setV;
    card.dataset.v=v;
    store.set(variantKey(card.dataset.scn),v);
    card.querySelectorAll('[data-set-v]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.setV===v)));
  }
  ScenarioShell.rescore();
});

/* ── Score sheet (shared/score.js): written out per scenario in dzc-scenario-sheets.js ── */
const scoreRows=s=>DZ_SHEETS[s.id]?DZ_SHEETS[s.id]({size:sizeFor(s),v:variantFor(s)}):[];
// A Round is marked when something still in play scores on it
const markRound=(s,r)=>scoreRows(s).some(x=>x.rounds&&x.rounds.includes(r));

/* ── The card, laid out as the Dropfleet scenario pages lay theirs out ── */
const sec=(label,html)=>html?`<div class="sec"><div class="sh"><h3 class="sl">${label}</h3></div><div class="sec-body">${html}</div></div>`:'';
const pill=label=>`<div class="spill-row"><span class="spill">${label}</span></div>`;
const attrs=o=>Object.entries(o).filter(([,v])=>v).map(([k,v])=>` data-${k}="${v}"`).join('');
// The book sets an objective's name in bold at the start of its line
const boldLead=(text,name)=>text.startsWith(name)?`<b>${name}</b>${text.slice(name.length)}`:text;

function render(s){
  CURRENT=s;
  const p=parse(s), shown=new Set();
  const effects=(typeof DZ_MAP_VARIANTS!=='undefined'&&DZ_MAP_VARIANTS[s.id])||{};
  const on=variantFor(s), size=sizeFor(s);

  // The Map Key is explained first, so what sits on the map (Objects, Features, turrets) is written out beside it
  // in the map column, and the two columns run to similar lengths
  const keyList=p.key.length?`<ul class="dz-key">${p.key.map(k=>segments(k.L).map(seg=>`<li${attrs({size:k.size})}>${seg.icon||'<span></span>'}<span class="rule-text">${keyLines(seg.lines)}</span></li>`).join('')).join('')}</ul>`:'';
  const key=keyList?keyList+explain(p.key.map(k=>sentence(k.L.lines)).join(' '),shown):'';

  const entry=p.entry?para(p.entry)+explain(p.entry,shown):'';

  // One H2 per objective, named as 9.6 names it: the scenario's own lines, then the rule word for word, then the terms they name
  const groups=[];
  p.objectives.forEach(o=>{ let g=groups.find(x=>x.name===o.name); if(!g) groups.push(g={name:o.name,items:[]}); g.items.push(o); });
  const objectives=groups.map(g=>{
    const O=T.objectives[g.name];
    const strike=Object.entries(effects).filter(([,e])=>(e.strike||[]).includes(g.name)).map(([v])=>v).join(' ');
    const lines=g.items.map(o=>`<p class="rule-text"${attrs({size:o.size})}>${segments(o.L)[0].icon}${boldLead(o.text,o.name)}</p>`).join('');
    shown.add('o:'+g.name);
    const rule=O.body.map(b=>para(halvable(b))).join('');
    return `<div class="dz-group"${attrs({'strike-v':strike})}>${pill(O.heading)}${lines}${rule}${explain(g.items.map(o=>o.text).join(' '),shown)}</div>`;
  }).join('')+(sized(s)?`<p class="rule-text" data-only="skirmish">${T.skirmish}</p>`:'');

  const variants=p.variants.length?`<ul class="pub-vlist">${p.variants.map(v=>`<li><button type="button" class="pub-vbtn" data-set-v="${v.n}" aria-pressed="${v.n===on}">${v.label}</button><div>${para(v.text)}${explain(v.text,shown)}</div></li>`).join('')}</ul>`:'';

  // A short label before a colon ("Zone Placement:") is bold, as printed
  const special=p.rules.length?`<ul class="rule-bullets">${p.rules.map(r=>`<li>${r.replace(/^([A-Z][A-Za-z]*(?: [A-Z][A-Za-z]*){0,2}):/,'<b>$1:</b>')}</li>`).join('')}</ul>${explain(p.rules.join(' '),shown)}`:'';

  const sizes=sized(s)?`<div class="pub-opts"><div class="seg pub-size" role="group" aria-label="Game size">${SIZES.map(z=>`<button type="button" data-set-size="${z.toLowerCase()}" aria-pressed="${z.toLowerCase()===size}">${TICK}<span class="pub-size-name">${z}</span><span class="pub-size-pts">${SIZE_PTS[z]} pts</span></button>`).join('')}</div></div>`:'';
  const src=mapSrc(s), img=`<img src="${src}" alt="${s.name} map">`;
  if(redrawn(s)) setTimeout(inlineMaps);

  return `<div class="scenario pub" data-scn="${s.id}" data-v="${on}" data-size="${size}">
    <div class="rules-col">
      <div class="sc-header"><h2 class="sc-name">${s.name}</h2></div>
      ${sec('Entry',entry)}
      ${sec('Objectives',objectives)}
      ${sec('Variants',variants)}
      ${sec('Special Rules',special)}
    </div>
    <div class="map-col">
      ${sizes}
      <div class="map-frame">${redrawn(s)?`<div class="map-svg" data-src="${src}">${img}</div>`:img}${spotsHTML(s)}</div>
      ${sec('Map Key',key)}
    </div>
  </div>`;
}

fetch('../data/dzc/scenarios.json').then(r=>r.json()).then(data=>{
  const list=data.scenarios;
  ScenarioShell.start({
    storageKey:'dzc',
    titleSuffix:'Dropzone Commander Scenarios',
    indexDocTitle:'Dropzone Commander: Scenarios',
    indexTitle:'Scenarios',
    // The Rulebook keeps the book's order; the Fauna pack reads A to Z, as the Dropfleet pages sort theirs
    groups:Object.entries(SOURCES).map(([k,v])=>(items=>({name:v.group,items:k==='rulebook'?items:items.slice().sort((a,b)=>a.name.localeCompare(b.name))}))(list.filter(s=>s.source===k))),
    id:s=>s.id,
    name:s=>s.name,
    // No roller: the rulebook has players choose a Scenario (3.3)
    random:false,
    thumb:mapSrc,
    columns:[
      {label:'Objectives',values:objectiveNames},
      {label:'Entry',values:s=>{const e=parse(s).entry;return e?[e]:[];}},
    ],
    render,
    source:s=>({url:SOURCE_URL,title:`${SOURCES[s.source].book}, page ${s.page}`}),
    scoreRows,
    markRound,
  });
});
</script>

<script src="https://type37.github.io/warlore-footer/footer.js" data-current="dropzone" defer></script>
