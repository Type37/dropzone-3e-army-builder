<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<title>Faction quick references — Dropzone Commander 3E</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700;800&family=Roboto+Slab:wght@700;800&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* Built on the Dropfleet chooser (ref/index.html at the fork point) rather
     than invented: same one-screen grid of faction cards, same print hint in
     the footer. Two things change — the six DZC accents from js/dzc-builder.js
     FACTIONS, and Jost in place of Barlow Condensed, which is out (CLAUDE.md). */
  :root { --ink: #14110c; --paper: #f6f2e9; --hair: #d8d0c0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--paper); color: var(--ink); font-family: 'Jost', sans-serif;
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 32px 16px;
  }
  h1 {
    font-family: 'Roboto Slab', serif; font-weight: 800; font-size: 22px;
    letter-spacing: .03em; margin-bottom: 4px; text-align: center;
  }
  .sub { font-size: 13px; color: #6b6459; margin-bottom: 28px; }
  .grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    gap: 10px; width: 100%; max-width: 720px;
  }
  /* Sharp cards, CLAUDE.md §4 — every card surface is square.
     The accent draws the border and the hover fill, never the resting text:
     PHR's gold is the faction's real colour and it is unreadable as 17px type
     on paper white. The colours are exactly the app's, and the house-rules
     test holds these six to js/dzc-builder.js. */
  a.card {
    display: flex; flex-direction: column; gap: 2px; padding: 15px 18px;
    border: 1.5px solid var(--f); border-radius: 0; text-decoration: none;
    color: var(--ink); box-shadow: inset 3px 0 0 var(--f);
    transition: background .12s ease, color .12s ease;
  }
  a.card:hover, a.card:focus-visible { background: var(--f); color: #fff; }
  a.card .name {
    font-weight: 700; font-size: 17px; letter-spacing: .03em; line-height: 1.1;
  }
  a.card .hint { font-size: 12.5px; opacity: .75; }
  .ucm        { --f: #30903c; }
  .phr        { --f: #c9a92c; }
  .scourge    { --f: #60489c; }
  .shaltari   { --f: #e46024; }
  .resistance { --f: #3c84c0; }
  .bioficer   { --f: #9c1818; }
  footer { margin-top: 34px; font-size: 12.5px; color: #6b6459; text-align: center; }
  footer a { color: inherit; }
</style>
</head>
<body>
<h1>Faction quick references</h1>
<p class="sub">Dropzone Commander 3rd Edition</p>
<div class="grid">
  <a class="card ucm"        href="sheet.html?faction=ucm"><span class="name">UCM</span><span class="hint">United Colonies of Mankind</span></a>
  <a class="card phr"        href="sheet.html?faction=phr"><span class="name">PHR</span><span class="hint">Post-Human Republic</span></a>
  <a class="card scourge"    href="sheet.html?faction=scourge"><span class="name">Scourge</span><span class="hint">The Scourge</span></a>
  <a class="card shaltari"   href="sheet.html?faction=shaltari"><span class="name">Shaltari</span><span class="hint">The Shaltari Tribes</span></a>
  <a class="card resistance" href="sheet.html?faction=resistance"><span class="name">Resistance</span><span class="hint">The Resistance</span></a>
  <a class="card bioficer"   href="sheet.html?faction=bioficer"><span class="name">Bioficers</span><span class="hint">The Bioficers</span></a>
</div>
<footer>
  Open a sheet and print it at Letter, margins none.<br>
  <a href="../index.html">Back to the army builder</a>
</footer>
</body></html>
